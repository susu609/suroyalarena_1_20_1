buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run-client1')
            // sumodlib: skip the title screen and open (or create) this
            // Void test world.
            property 'sumodlib.devWorld', 'Royal Arena Test'
        }

        client2 {
            parent minecraft.runs.client
            workingDirectory project.file('run-client2')
            // The second client joins over LAN instead of opening a world.
            property 'sumodlib.devWorld', ''
            args '--username', 'Dev2'
        }

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Keep mavenLocal first: with sumodlib_source=local it serves the copy
    // you published yourself, which is handy for testing unreleased changes.
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    // sumodlib is built from its GitHub repo by JitPack (see README).
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.susu609' }
    }
}

// sumodlib_source=jitpack (default): download sumodlib from JitPack.
// sumodlib_source=central: download it from Maven Central (once released).
// sumodlib_source=local: use the copy installed by publishToMavenLocal.
def sumodlibNotation = sumodlib_source == 'local' ?
        "net.susu609.modlib:sumodlib:${sumodlib_version}" :
        sumodlib_source == 'central' ?
        "io.github.susu609:sumodlib:${sumodlib_version}" :
        "com.github.susu609:sumodlib_1_20_1:${sumodlib_jitpack_version}"

if (sumodlib_source == 'local') {
    def m2 = System.getProperty('maven.repo.local') ?:
            "${System.getProperty('user.home')}/.m2/repository"
    def published = new File(m2,
            "net/susu609/modlib/sumodlib/${sumodlib_version}/sumodlib-${sumodlib_version}.jar")
    if (!published.exists()) {
        logger.warn("sumodlib ${sumodlib_version} was not found in Maven Local " +
                "(${published}). In the sumodlib_1_20_1 project run " +
                "'gradlew publishToMavenLocal', or set sumodlib_source=jitpack " +
                "in gradle.properties.")
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(sumodlibNotation)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            sumodlib_version_range : sumodlib_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('runDomainSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.susu609.royalarena.DomainSmokeTest'
}

tasks.named('check').configure {
    dependsOn 'runDomainSmoke'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
