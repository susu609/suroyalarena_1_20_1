# Publishes the card stats page (docs/stats/) with GitHub Pages:
# https://susu609.github.io/suroyalarena_1_20_1/
# docs/stats/build-site.sh gathers the page, its data and the card portraits;
# only that folder is deployed.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Runs when the page, its data or the card art change on
# master, or by hand (Actions > stats-site > Run workflow).
name: stats-site

on:
  push:
    branches: [master]
    paths:
      - 'docs/stats/**'
      - 'src/main/resources/assets/royalarena/textures/gui/card/**'
      - '.github/workflows/stats-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cutting the
# current one off half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: sh docs/stats/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
