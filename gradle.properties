org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Required on the current development machine because ForgeGradle certificate
# validation fails for maven.minecraftforge.net.
systemProp.net.minecraftforge.gradle.check.certs=false
# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
# Mojang official mappings
mapping_channel=official
mapping_version=1.20.1
# Template identity
mod_id=royalarena
mod_name=Su Royal Arena
mod_version=1.0.0
mod_group_id=net.susu609.royalarena
mod_authors=SuSu609
mod_description=Clash Royale inspired arena battle mod for Minecraft.
# Shared library
sumodlib_version=1.0.0
sumodlib_version_range=[1.0.0,2.0.0)
license="${mod_license}"